<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云端文件</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#1f2937;background:#f6f7f9}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e5e7eb}header .wrap,main{max-width:960px;margin:auto;padding-left:20px;padding-right:20px}.top{height:66px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:700}.sub{color:#6b7280;font-size:13px;margin-top:2px}.manage-link{border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:8px 13px;color:#374151;cursor:pointer}.manage-link:hover{background:#f3f4f6}main{padding-top:28px;padding-bottom:48px}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin-bottom:16px}.panel-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.panel-title h1,.panel-title h2{margin:0;font-size:18px}.muted{color:#6b7280;font-size:14px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{border:0;border-radius:8px;padding:9px 14px;background:#2563eb;color:#fff;cursor:pointer;font-size:14px}button:hover{filter:brightness(1.05)}button.secondary{background:#eef2ff;color:#1d4ed8}button.danger{background:#fef2f2;color:#b91c1c}button:disabled{opacity:.55;cursor:not-allowed}input[type=text],input[type=password]{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:10px 12px;font-size:14px;outline:none}input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #dbeafe}.form-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}.upload-row{display:grid;grid-template-columns:1fr 1.4fr auto;gap:10px;align-items:center}.field label{display:block;color:#6b7280;font-size:13px;margin-bottom:5px}.file-input{width:100%;font-size:14px}.hint{font-size:13px;color:#6b7280;margin:10px 0 0}.error{color:#b91c1c;font-size:14px;margin-top:10px}.success{color:#15803d;font-size:14px;margin-top:10px}.hidden{display:none!important}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:12px 10px;border-bottom:1px solid #edf0f2;text-align:left;vertical-align:middle}th{color:#6b7280;font-size:13px;font-weight:600;white-space:nowrap}td:first-child{font-weight:600;min-width:180px}.url{display:block;max-width:270px;color:#2563eb;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.url:hover{text-decoration:underline}.empty{text-align:center;padding:34px 10px;color:#6b7280}.status{font-size:13px;color:#6b7280}.admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.admin-head h2{margin:0;font-size:17px}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.file-actions{display:flex;gap:6px;flex-wrap:wrap}.file-actions button{padding:6px 9px;font-size:12px}.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.38);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.modal{width:min(430px,100%);background:#fff;border-radius:12px;padding:22px;box-shadow:0 18px 45px rgba(0,0,0,.2)}.modal h2{margin:0 0 8px;font-size:18px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}@media(max-width:700px){.upload-row,.admin-grid,.form-row{grid-template-columns:1fr}.top{height:auto;padding-top:15px;padding-bottom:15px;align-items:flex-start}.manage-link{margin-top:2px}th:nth-child(2),td:nth-child(2){display:none}.url{max-width:180px}}
</style>
</head>
<body>
<header><div class="wrap top"><div><div class="brand">云端文件</div><div class="sub">公开读取 · 管理员上传和更新</div></div><button class="manage-link" id="manageBtn">管理</button></div></header>
<main>
<section class="panel"><div class="panel-title"><h1>文件列表</h1><div class="actions"><span class="status" id="listStatus">正在加载…</span><button class="secondary" id="refreshBtn">刷新</button></div></div><div class="table-wrap"><table><thead><tr><th>文件</th><th>大小</th><th>上传时间</th><th>公开地址</th><th id="actionHead" class="hidden">操作</th></tr></thead><tbody id="fileRows"></tbody></table><div id="empty" class="empty hidden">暂时没有上传文件。</div></div></section>
<section id="adminPanel" class="panel hidden"><div class="admin-head"><h2>管理文件</h2><button class="secondary" id="downloadBatBtn">上传脚本</button><button class="secondary" id="logoutBtn">退出管理</button></div><div class="admin-grid"><div class="field"><label for="pathInput">云端文件名</label><input id="pathInput" type="text" placeholder="例如：docs/example.txt"></div><div class="field"><label for="fileInput">选择本地文件</label><input id="fileInput" class="file-input" type="file"></div></div><div class="actions" style="margin-top:14px"><button id="uploadBtn">上传 / 更新</button><span class="status">单个文件最大 1MB</span></div><div id="uploadMessage"></div></section>
</main>
<div id="modalBackdrop" class="modal-backdrop hidden"><div class="modal"><h2>进入管理</h2><p class="muted">请输入 EdgeOne 环境变量中的 WRITE_TOKEN。</p><input id="tokenInput" type="password" autocomplete="off" placeholder="WRITE_TOKEN"><div id="authMessage"></div><div class="modal-actions"><button class="secondary" id="cancelAuth">取消</button><button id="verifyBtn">验证</button></div></div></div>
<script>const $ = (id) => document.getElementById(id);
const base = location.origin;
let token = sessionStorage.getItem("cloudsync_token") || "";
let isAdmin = false;
let files = [];

function show(id, visible = true) {
  $(id).classList.toggle("hidden", !visible);
}

function setMessage(id, text, type = "error") {
  const element = $(id);
  element.className = type;
  element.textContent = text;
}

function encodeKey(key) {
  return key.split("/").map((part) => encodeURIComponent(part)).join("/");
}

function formatSize(value) {
  const size = Number(value) || 0;
  if (size < 1024) return `${size} B`;
  if (size < 1024 * 1024) return `${(size / 1024).toFixed(1)} KB`;
  return `${(size / 1024 / 1024).toFixed(2)} MB`;
}

function formatTime(value) {
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? "-" : date.toLocaleString();
}

function authHeaders() {
  return token ? { Authorization: "Bearer " + token } : {};
}

function explainError(code) {
  return {
    invalid_token: "Token 不正确或已失效",
    server_token_not_configured: "服务端还没有设置 WRITE_TOKEN",
    file_too_large: "文件超过 1MB",
    invalid_key: "文件名不符合要求",
    reserved_key: "这个文件名不能使用",
    server_error: "服务端发生错误，请确认已重新部署并稍后重试",
  }[code] || code || "操作失败";
}

async function loadFiles() {
  $("listStatus").textContent = "正在加载…";
  try {
    const response = await fetch(`${base}/api/files`, { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    files = data.files || [];
    renderFiles();
    $("listStatus").textContent = `${files.length} 个文件`;
  } catch {
    files = [];
    renderFiles();
    $("listStatus").textContent = "加载失败";
    $("empty").textContent = "文件列表加载失败，请刷新重试。";
  }
}

function appendTextCell(row, value, className = "") {
  const cell = document.createElement("td");
  cell.textContent = value == null ? "" : String(value);
  if (className) cell.className = className;
  row.appendChild(cell);
  return cell;
}

function renderFiles() {
  const body = $("fileRows");
  body.replaceChildren();
  show("empty", files.length === 0);
  show("actionHead", isAdmin);
  if (!files.length) return;

  for (const file of files) {
    const row = document.createElement("tr");
    appendTextCell(row, file.key);
    appendTextCell(row, formatSize(file.size));
    appendTextCell(row, formatTime(file.updatedAt));

    const urlCell = document.createElement("td");
    const link = document.createElement("a");
    link.className = "url";
    link.href = file.url;
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = file.url;
    urlCell.appendChild(link);
    row.appendChild(urlCell);

    if (isAdmin) {
      const actionCell = document.createElement("td");
      const actionBox = document.createElement("div");
      actionBox.className = "file-actions";

      const updateButton = document.createElement("button");
      updateButton.className = "secondary";
      updateButton.textContent = "更新";
      updateButton.onclick = () => chooseUpdate(file.key);

      
      const deleteButton = document.createElement("button");
      deleteButton.className = "danger";
      deleteButton.textContent = "删除";
      deleteButton.onclick = () => removeFile(file.key);

      actionBox.append(updateButton, deleteButton);
      actionCell.appendChild(actionBox);
      row.appendChild(actionCell);
    }
    body.appendChild(row);
  }
}

function openAuth() {
  $("tokenInput").value = "";
  $("authMessage").textContent = "";
  show("modalBackdrop");
  setTimeout(() => $("tokenInput").focus(), 0);
}

function closeAuth() {
  show("modalBackdrop", false);
}

async function checkToken(value) {
  const response = await fetch(`${base}/api/auth`, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ token: value }),
  });
  const data = await response.json().catch(() => ({}));
  return { response, data };
}

async function verify() {
  const value = $("tokenInput").value.trim();
  if (!value) {
    setMessage("authMessage", "请输入 Token");
    return;
  }

  $("verifyBtn").disabled = true;
  $("authMessage").textContent = "验证中…";
  try {
    const { response, data } = await checkToken(value);
    if (!response.ok || !data.ok) {
      setMessage("authMessage", explainError(data.error));
      return;
    }
    token = value;
    isAdmin = true;
    sessionStorage.setItem("cloudsync_token", token);
    closeAuth();
    show("adminPanel");
    renderFiles();
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  } catch {
    setMessage("authMessage", "无法连接服务，请确认项目已经重新部署");
  } finally {
    $("verifyBtn").disabled = false;
  }
}

async function validateStoredToken() {
  if (!token) return;
  try {
    const { response, data } = await checkToken(token);
    if (response.ok && data.ok) {
      isAdmin = true;
      show("adminPanel");
      renderFiles();
    } else {
      token = "";
      isAdmin = false;
      sessionStorage.removeItem("cloudsync_token");
      renderFiles();
    }
  } catch {
    token = "";
    isAdmin = false;
    sessionStorage.removeItem("cloudsync_token");
    renderFiles();
  }
}

function chooseUpdate(key) {
  $("pathInput").value = key;
  show("adminPanel");
  $("fileInput").click();
}

async function upload() {
  const path = $("pathInput").value.trim();
  const file = $("fileInput").files[0];
  if (!path) return setMessage("uploadMessage", "请输入云端文件名");
  if (!file) return setMessage("uploadMessage", "请选择本地文件");
  if (path.includes("..") || path.startsWith("__meta/") || /[\\:*?"<>|]/.test(path)) {
    return setMessage("uploadMessage", "文件名不符合要求");
  }
  if (file.size > 1024 * 1024) return setMessage("uploadMessage", "文件超过 1MB，无法上传");
  if (!token) return setMessage("uploadMessage", "请先验证 Token");

  $("uploadBtn").disabled = true;
  setMessage("uploadMessage", "上传中…", "status");
  try {
    const response = await fetch(`${base}/${encodeKey(path)}`, {
      method: "POST",
      headers: { ...authHeaders(), "content-type": "text/plain; charset=utf-8" },
      body: await file.arrayBuffer(),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      setMessage("uploadMessage", explainError(data.error) + `（HTTP ${response.status}）`);
      return;
    }
    setMessage("uploadMessage", "上传成功", "success");
    $("fileInput").value = "";
    await loadFiles();
  } catch {
    setMessage("uploadMessage", "上传失败，请检查网络或重新验证 Token");
  } finally {
    $("uploadBtn").disabled = false;
  }
}

async function removeFile(key) {
  if (!confirm(`确定删除“${key}”吗？`)) return;
  try {
    const response = await fetch(`${base}/${encodeKey(key)}`, {
      method: "DELETE",
      headers: authHeaders(),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) return alert(explainError(data.error));
    
$("fileInput").onchange = () => { var f = $("fileInput").files[0]; if (f) $("pathInput").value = f.name; };
loadFiles();
  } catch {
    alert("删除失败，请检查网络");
  }
}

function downloadBat() {
  if (!token) { alert('请先验证 Token'); return; }
  var batContent = '@echo off\r\n' +
    'chcp 65001 >nul\r\n' +
    'set "BASE_URL=' + base + '"\r\n' +
    'set "TOKEN=' + token + '"\r\n' +
    '\r\n' +
    'echo ========================================\r\n' +
    'echo   云端文件上传工具\r\n' +
    'echo ========================================\r\n' +
    'echo.\r\n' +
    '\r\n' +
    'if not "%~1"=="" (\r\n' +
    '    set "FILE=%~1"\r\n' +
    ') else (\r\n' +
    '    set /p "FILE=将文件拖到此窗口后按回车："\r\n' +
    ')\r\n' +
    'if "%FILE%"=="" (echo 未指定文件 & pause & exit /b 1)\r\n' +
    'if not exist "%FILE%" (echo 文件不存在 & pause & exit /b 1)\r\n' +
    '\r\n' +
    'for %%%%i in ("%FILE%") do set "DEFAULT_NAME=%%%%~nxi"\r\n' +
    'set "KEY=%DEFAULT_NAME%"\r\n' +
    'set /p "KEY=云端文件名（回车用 %DEFAULT_NAME%："\r\n' +
    'if "%KEY%"=="" set "KEY=%DEFAULT_NAME%"\r\n' +
    '\r\n' +
    'echo 正在上传...\r\n' +
    'curl.exe -sS -X POST "%BASE_URL%/%KEY%" -H "Authorization: Bearer %TOKEN%" --data-binary "@%FILE%"\r\n' +
    'echo.\r\n' +
    'if %errorlevel%==0 (echo 上传成功: %BASE_URL%/%KEY%) else (echo 上传失败)\r\n' +
    'echo.\r\n' +
    'pause\r\n';
  var link = document.createElement('a');
  link.href = URL.createObjectURL(new Blob([batContent], { type: 'text/plain;charset=utf-8' }));
  link.download = 'upload.bat';
  link.click();
  setTimeout(function() { URL.revokeObjectURL(link.href); }, 1000);
}


$("fileInput").onchange = () => { var f = $("fileInput").files[0]; if (f) $("pathInput").value = f.name; };
loadFiles();
validateStoredToken();
</script>
</body>
</html>
